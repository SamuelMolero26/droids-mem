name: Release

# Tag-triggered runs execute the workflow file as it exists AT the tagged
# commit — a workflow fix must land before the tag is cut.

on:
  push:
    tags:
      - "v*.*.*"
  # Dispatch from the tag ref itself (Actions UI → "Use workflow from" → the tag).
  # No tag input: `Validate tag` requires the checked-out tree to BE the tag, so
  # an input could only ever restate GITHUB_REF — and it was the one
  # untrusted string in this workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'SamuelMolero26/droids-mem'
    permissions:
      contents: read
      id-token: write        # OIDC token for build provenance attestation (SLSA)
      attestations: write    # persist the attestation to the repo (actions/attest-build-provenance)
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must match vMAJOR.MINOR.PATCH"; exit 1; }
          git fetch --tags --force origin
          git rev-parse --verify "$TAG^{commit}" >/dev/null || exit 1
          # The tree being built must BE the tag: on workflow_dispatch the
          # checkout is the dispatch ref, not the tag. Fails closed.
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")" ] || { echo "checked-out tree does not match tag $TAG"; exit 1; }
          git fetch origin main
          # only merged-to-main commits release
          git merge-base --is-ancestor "$TAG" origin/main || { echo "tag $TAG is not an ancestor of origin/main"; exit 1; }
          grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "CHANGELOG.md missing ## [${TAG#v}]"; exit 1; }

      - name: Build binary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          OUT="dist/droids-mem-$TAG-$GOOS-$GOARCH"
          go build -trimpath -ldflags "-s -w -X main.version=$TAG" -tags "grammar_subset,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_javascript,grammar_subset_python" -o "$OUT" ./cmd/droids-mem
          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          ls -lh dist/

      - name: Verify binary size (< 32 MB)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # The cap catches an accidentally fat build -- chiefly a build that lost
        # the grammar_subset_* tags, which embeds all 206 tree-sitter grammars
        # and lands around 42 MB. It is not a budget the binary is expected to
        # sit near: linux/amd64 measures ~23.5 MB once the mapper tier is in.
        run: |
          SIZE=$(stat -c %s dist/droids-mem-$TAG-$GOOS-$GOARCH)
          MAX=$((32 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "Binary size $SIZE exceeds 32 MB limit"
            exit 1
          fi
          echo "Binary size: $SIZE bytes (limit: $MAX)"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/droids-mem-${{ steps.version.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}'
          subject-name: droids-mem-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: droids-mem-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # The approval gate governs PUBLICATION. Build artifacts are SLSA-attested
    # before this job runs — the gate stops publishing, not provenance signing.
    environment: release
    if: github.repository == 'SamuelMolero26/droids-mem'
    permissions:
      contents: write    # gh release create + upload release assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must match vMAJOR.MINOR.PATCH"; exit 1; }
          git fetch --tags --force origin
          git rev-parse --verify "$TAG^{commit}" >/dev/null || exit 1
          # The tree being built must BE the tag: on workflow_dispatch the
          # checkout is the dispatch ref, not the tag. Fails closed.
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")" ] || { echo "checked-out tree does not match tag $TAG"; exit 1; }
          git fetch origin main
          # only merged-to-main commits release
          git merge-base --is-ancestor "$TAG" origin/main || { echo "tag $TAG is not an ancestor of origin/main"; exit 1; }
          grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "CHANGELOG.md missing ## [${TAG#v}]"; exit 1; }

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## droids-mem $TAG"
            echo
            echo "See [CHANGELOG.md](./CHANGELOG.md) for full release notes."
            echo
            echo "### Install"
            echo
            echo '```'
            echo "brew tap samuelmolero26/tap && brew install droids-mem"
            echo '```'
            echo
            echo "Or download a prebuilt binary below."
            echo
            echo "### Verify provenance"
            echo
            echo "Every binary has a SLSA Level 2 attestation signed by GitHub Actions."
            echo "\`gh attestation verify\` fetches it from GitHub automatically — no extra download:"
            echo
            echo '```'
            echo "gh attestation verify droids-mem-$TAG-darwin-arm64 --repo SamuelMolero26/droids-mem"
            echo '```'
            echo
            echo "Swap the filename for your platform (\`darwin-amd64\`, \`linux-arm64\`, \`linux-amd64\`)."
          } > release-notes.md
          cat release-notes.md

      # Sidecars travel inside the same artifact as the binaries, so this
      # catches transport corruption, not tampering — the SLSA attestation
      # is the integrity guarantee.
      - name: Verify SHA256 sidecars
        run: |
          cd dist && for f in *.sha256; do sha256sum -c "$f" >/dev/null || exit 1; done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            dist/*

      - name: Publish Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          REPO="SamuelMolero26/droids-mem"
          TAP="SamuelMolero26/homebrew-tap"
          BASE="https://github.com/$REPO/releases/download/$TAG"

          sha() { awk '{print $1}' "dist/droids-mem-$TAG-$1.sha256"; }
          DARWIN_ARM64=$(sha darwin-arm64)
          DARWIN_AMD64=$(sha darwin-amd64)
          LINUX_ARM64=$(sha linux-arm64)
          LINUX_AMD64=$(sha linux-amd64)

          git clone "https://github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/droids-mem.rb <<EOF
          class DroidsMem < Formula
            desc "Persistent cross-session memory + native code graph for coding agents"
            homepage "https://github.com/$REPO"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "$BASE/droids-mem-$TAG-darwin-arm64"
                sha256 "$DARWIN_ARM64"
              else
                url "$BASE/droids-mem-$TAG-darwin-amd64"
                sha256 "$DARWIN_AMD64"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "$BASE/droids-mem-$TAG-linux-arm64"
                sha256 "$LINUX_ARM64"
              else
                url "$BASE/droids-mem-$TAG-linux-amd64"
                sha256 "$LINUX_AMD64"
              end
            end

            def install
              bin.install Dir["droids-mem-*"].first => "droids-mem"
            end

            test do
              assert_match "droids-mem", shell_output("#{bin}/droids-mem --version")
            end
          end
          EOF

          cd tap
          git add Formula/droids-mem.rb
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "droids-mem $VERSION"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" HEAD:main
